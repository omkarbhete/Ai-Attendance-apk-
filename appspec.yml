version: 0.0
os: linux
files:
  - source: /
    destination: /opt/snapclass/releases/current
    
permissions:
  - object: /opt/snapclass
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory
  - object: /opt/snapclass/releases
    owner: ec2-user
    group: ec2-user
    mode: 755
    type:
      - directory

hooks:
  ApplicationStop:
    - location: scripts/stop_application.sh
      timeout: 300
      runas: ec2-user

  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 300
      runas: ec2-user

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 600
      runas: ec2-user

  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 300
      runas: ec2-user

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 300
      runas: ec2-user

