apiVersion: v1
kind: Service
metadata:
  name: snapclass-service
  namespace: snapclass
  labels:
    app: snapclass
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  selector:
    app: snapclass
    component: application
  ports:
  - name: http
    port: 80
    targetPort: 8501
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8501
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: Service
metadata:
  name: snapclass-internal
  namespace: snapclass
  labels:
    app: snapclass
spec:
  type: ClusterIP
  selector:
    app: snapclass
    component: application
  ports:
  - name: http
    port: 8501
    targetPort: 8501
    protocol: TCP
  - name: health
    port: 8502
    targetPort: 8502
    protocol: TCP

