# Kubernetes Secret for sensitive data
# NOTE: In production, use AWS Secrets Manager with External Secrets Operator
# or sealed-secrets for GitOps workflows
apiVersion: v1
kind: Secret
metadata:
  name: snapclass-secrets
  namespace: snapclass
type: Opaque
stringData:
  # Database Credentials
  # Replace these with actual values or use external secrets management
  DB_HOST: "your-rds-endpoint.region.rds.amazonaws.com"
  DB_USERNAME: "snapclass_admin"
  DB_PASSWORD: "CHANGE_THIS_PASSWORD"
  
  # Redis Credentials
  REDIS_ENDPOINT: "your-redis-endpoint.cache.amazonaws.com"
  REDIS_AUTH_TOKEN: "CHANGE_THIS_TOKEN"
  
  # S3 Configuration
  S3_BUCKET: "snapclass-prod-assets"
  AWS_REGION: "us-east-1"
  
  # Application Secret
  APP_SECRET_KEY: "CHANGE_THIS_SECRET_KEY"

