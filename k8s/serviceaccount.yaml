apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapclass-sa
  namespace: snapclass
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/SnapClassEKSPodRole

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: snapclass-role
  namespace: snapclass
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: snapclass-rolebinding
  namespace: snapclass
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: snapclass-role
subjects:
- kind: ServiceAccount
  name: snapclass-sa
  namespace: snapclass

