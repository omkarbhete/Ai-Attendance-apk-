services:
  # PostgreSQL Database (for local development)
  postgres:
    image: postgres:14-alpine
    container_name: snapclass-db
    environment:
      POSTGRES_DB: snapclass
      POSTGRES_USER: snapclass_admin
      POSTGRES_PASSWORD: dev_password_change_in_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapclass_admin -d snapclass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snapclass-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: snapclass-redis
    command: redis-server --requirepass dev_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - snapclass-network

  # SnapClass Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: snapclass-app
    ports:
      - "8501:8501"  # Streamlit
      - "8502:8502"  # Health check
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: snapclass
      DB_USERNAME: snapclass_admin
      DB_PASSWORD: dev_password_change_in_production
      
      # Redis Configuration
      REDIS_ENDPOINT: redis
      REDIS_PORT: 6379
      REDIS_AUTH_TOKEN: dev_redis_password
      
      # Application Configuration
      APP_ENV: development
      APP_SECRET_KEY: dev-secret-key-change-in-production
      LOG_LEVEL: INFO
      
      # Streamlit Configuration
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      - ./src:/app/src
      - ./app.py:/app/app.py
      - app_logs:/var/log/snapclass
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8502/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - snapclass-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local

networks:
  snapclass-network:
    driver: bridge

